name: Release

# LZP-101 — stories 22.1, 22.5, 22.6, 22.8.
#
# One `git tag v2.0.1` produces: a universal macOS DMG small enough to email,
# a signed update archive, and a signed update manifest, published together to
# GitHub Releases. Every device on the single "stable" channel then converges
# on it by itself (22.5).
#
# FOUR THINGS IN HERE ARE LOAD-BEARING AND SHOULD NOT BE "SIMPLIFIED":
#
#  1. The updater key is REQUIRED. The very first step fails if the secret is
#     missing, and the manifest generator has no code path that produces an
#     entry without a verified signature. An app that reaches Mom as an email
#     attachment must not grow a hijackable update path (22.6).
#
#  2. Apple signing is a FLAG. ██ D1 WAS REVERSED ON 2026-09-05 ██ — the
#     Developer ID was bought and the app was signed, notarized and stapled by
#     hand that day. What this note said before the reversal, verbatim:
#
#       > 2. Apple signing is a FLAG THAT IS OFF (PO decision D1 — ship
#       >    unsigned). Every signing step is
#       >    `if: vars.ENABLE_APPLE_SIGNING == 'true'`. Turning it on later is a
#       >    repository variable plus secrets — no edit to this file, no edit to
#       >    tauri.conf.json.
#
#     The promise held: turning it on cost secrets and a variable, no code
#     change. The half that did NOT hold is that the file then verified nothing
#     about what signing produced — see 4. The `if:` conditions stay exactly as
#     they were, and the ad-hoc branch stays fully supported, because the day a
#     certificate expires is a certainty and that branch is the fallback.
#     See docs/v2/RELEASE.md § "Turning Apple signing on".
#
#  3. The DMG size gate. Story 22.1's "≈15 MB" is not an aesthetic; it is the
#     German mail-provider attachment ceiling once base64 encoding is applied.
#     See the budget step for the arithmetic.
#
#  4. The notarization chain, steps 8b -> 9b -> 10, IN THAT ORDER. The read-me
#     injection REWRITES the image Tauri built and re-signs it; a signature can
#     be put back and a staple cannot. So the rewritten DMG is submitted to
#     notarytool and stapled in 9b, and 10's `spctl` is a hard gate on the
#     signed branch (and still `|| true` ad hoc, where `rejected` is correct).
#     Remove or reorder any of it and the pipeline goes back to being able to
#     publish an unnotarized DMG under a green tick.
#     `.github/scripts/check-release-config.mjs` fails the pre-flight if so.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      rehearse:
        description: 'Build and run every gate, publish nothing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suites:
    name: Suites
    uses: ./.github/workflows/ci.yml

  build:
    name: Universal build, gates, publish
    needs: suites
    runs-on: macos-14
    timeout-minutes: 90

    env:
      # ── DMG budget, story 22.1 ────────────────────────────────────────────
      # Mail providers cap the ENCODED attachment. base64 inflates by 4/3 plus
      # line breaks — call it x1.36 — so a raw DMG budget is the provider cap
      # divided by 1.36:
      #
      #   GMX / Web.de / T-Online   20 MB cap  ->  ~14.7 MB of DMG
      #   Gmail / iCloud / Outlook  25 MB cap  ->  ~18.4 MB of DMG
      #
      # WARN at the 20 MB-provider budget: still shippable, but the invitation
      # email (deliverable 28) must lead with the GitHub Releases link rather
      # than the attachment.
      # FAIL at 20 MiB: past this the DMG does not fit any consumer mailbox and
      # 22.1's "one email attachment and one drag" is simply untrue.
      DMG_WARN_BYTES: '14700000'
      DMG_FAIL_BYTES: '20971520'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 1. Refuse to start without the updater key (22.6) ─────────────────
      # First step on purpose: fails in seconds, before a 20-minute build, with
      # an error that says exactly what to do.
      - name: The updater key must exist
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=No updater signing key::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set. Generate a key with 'cargo tauri signer generate -w ~/.langzeitplaner-updater.key', store the PRIVATE half as that secret and its password as TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and paste the PUBLIC half into src-tauri/tauri.conf.json -> plugins.updater.pubkey. Full instructions: docs/v2/RELEASE.md section 'The updater key'. Refusing to build an app that would ship without a verifiable update path (story 22.6)."
            exit 1
          fi
          if [ -z "$KEY_PW" ]; then
            echo "::warning title=Updater key has no password::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty. That works, but a passwordless key in a secret store is one leak away from being usable. Prefer a password."
          fi
          echo "updater signing key present"

      # ── 2. Version resolution ─────────────────────────────────────────────
      - name: Resolve version and tag
        id: v
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$VERSION"
          fi
          PRERELEASE=false
          case "$TAG" in *-*) PRERELEASE=true ;; esac
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "version $VERSION, tag $TAG, prerelease $PRERELEASE"

      # ── 3. Point the updater at this repository ───────────────────────────
      # tauri.conf.json ships with an OWNER/REPO placeholder because the repo
      # did not exist when it was written, and because a hard-coded slug is a
      # thing that silently rots after a rename or a transfer. Deriving it from
      # github.repository means the shipped app can only ever check the
      # repository it was actually built from.
      - name: Point the updater endpoint at this repository
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            const repo = process.env.GITHUB_REPOSITORY;
            c.plugins.updater.endpoints = c.plugins.updater.endpoints.map((u) => u.replace("OWNER/REPO", repo));
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            console.log("updater endpoint ->", c.plugins.updater.endpoints.join(", "));
          '

      # ── 4. Strict pre-flight ──────────────────────────────────────────────
      # Version agreement across package.json / Cargo.toml / tauri.conf.json /
      # the tag; a real (non-placeholder) updater public key; a resolved https
      # endpoint; still zero runtime npm dependencies; the release-critical
      # shape of tauri.conf.json intact, including "no signing identity in the
      # file" so that D1 stays reversible without a code change.
      - name: Release pre-flight (strict)
        run: node .github/scripts/check-release-config.mjs --tag "${{ steps.v.outputs.tag }}" --strict

      # ── 5. Toolchain ──────────────────────────────────────────────────────
      - name: Rust targets for the universal binary
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo and the build directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-macos14-${{ hashFiles('src-tauri/Cargo.toml') }}-v1
          restore-keys: |
            cargo-macos14-

      # Installed through cargo rather than npm, so the release path stays free
      # of a node_modules tree the project deliberately does not have.
      # Cold cost ~6 min; warm it comes out of the cache above.
      - name: Tauri CLI
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked
          fi
          cargo tauri --version

      # ── 6. Apple signing — THE FLAG, AND IT IS OFF (decision D1) ──────────
      #
      # ██ "Nothing below runs today" — that sentence stood here until 2026-09-05
      # and is now false: D1 was reversed, the certificate exists, and everything
      # below runs on a release. It is kept as a record of why the steps are
      # written the way they are. The recipe is unchanged and still correct:
      #   1. buy a Developer ID (99 EUR/yr) and export the certificate as .p12
      #   2. create an App Store Connect API key (Developer -> Integrations)
      #   3. add the secrets and variables listed in docs/v2/RELEASE.md
      #   4. set repository variable ENABLE_APPLE_SIGNING = true
      # No file in this repository changes. That is the whole point: D1 said
      # "no" to a 99 EUR/yr fee, not to signing, and reversing it must not cost
      # an engineering day.
      - name: Import Apple signing certificate
        if: vars.ENABLE_APPLE_SIGNING == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Enable signing and notarization
        if: vars.ENABLE_APPLE_SIGNING == 'true'
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=${{ vars.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_API_ISSUER=${{ vars.APPLE_API_ISSUER }}"
            echo "APPLE_API_KEY=${{ vars.APPLE_API_KEY_ID }}"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
          echo "::notice title=Apple signing enabled::Building signed and notarized. The guided unlock screen (LZP-106) is no longer the only path onto a family Mac — but leave it in the product; it costs nothing and it is the fallback."

      # Ad-hoc signature when Apple signing is off. NOT cosmetic:
      # `lipo` strips the code signature while fusing the two slices, and
      # macOS on Apple silicon refuses to execute an arm64 binary that carries
      # no signature at all — the app would be killed on launch, on the exact
      # machines this release most needs to reach. "-" is the ad-hoc identity.
      # The verification step below proves it took.
      - name: Ad-hoc sign (Apple signing is off — decision D1)
        if: vars.ENABLE_APPLE_SIGNING != 'true'
        run: |
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          echo "::notice title=Unsigned build (D1)::No Developer ID. The bundle gets an ad-hoc signature so it will launch on Apple silicon; Gatekeeper will still quarantine it, which is what LZP-106's guided Systemeinstellungen unlock screen exists for."

      # ── 6b. Release artwork (LZP-107) ─────────────────────────────────────
      # Every image in the release is generated here from committed SVG sources:
      # the app icon (.icns), the DMG window background, and the illustration the
      # invitation e-mail carries. Nothing image-shaped is committed to the repo,
      # so nothing image-shaped can be stale or unreproducible.
      #
      # This MUST run before `tauri build`: bundle.icon points at
      # src-tauri/icons/icon.icns and bundle.macOS.dmg.background at
      # src-tauri/dmg/background.tiff, and neither file exists until this step.
      - name: Build release artwork
        run: ./scripts/build-release-assets.sh

      # The artwork and the icon positions live in different files and drift in
      # silence: widen the window, and the arrow now points past the folder. The
      # only way to see it otherwise is to cut a release and look at it.
      - name: DMG geometry agrees with the artwork
        run: node .github/scripts/check-dmg-geometry.mjs

      # The unlock page is produced by the step above (build-release-assets.sh calls
      # build-unlock-page.sh) and consumed by two different DMG builders. This asserts
      # the producer, both consumers and the gate below still name the same file, and
      # that the read-me's icon box clears the app's and the Applications folder's.
      # It runs BEFORE the build so a naming or layout mistake costs seconds, not the
      # ~40 minutes of a universal Rust build.
      - name: The unlock page is named, placed and gated
        run: node .github/scripts/check-dmg-readme.mjs

      # ── 7. Build ──────────────────────────────────────────────────────────
      # --target universal-apple-darwin builds both slices and lipos them, so
      # one DMG serves Intel and Apple silicon alike (22.1: Mom's Mac may be
      # either, and nobody is going to ask her which).
      #
      # The bundled Schulferien datasets ride along inside the app bundle as
      # part of the frontend (src/js/ferien.js) — amendment A11: story 7.4's
      # "refresh" IS this release channel. There is no separate data download
      # and no code here to fetch one.
      - name: Build universal bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUST_BACKTRACE: '1'
        run: cargo tauri build --target universal-apple-darwin

      # ── 8. Locate the artifacts ───────────────────────────────────────────
      # Globbed, not hard-coded: Tauri's filenames carry the version and have
      # changed shape between minor releases. Exactly one match, or stop.
      - name: Locate build output
        id: art
        run: |
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          one() {
            local pattern="$1" label="$2"
            local matches count
            # -d matters: without it `ls` on a .app lists the bundle's contents
            # instead of naming the bundle.
            matches=$(ls -1d $pattern 2>/dev/null || true)
            count=$(printf '%s' "$matches" | grep -c . || true)
            if [ "$count" != "1" ]; then
              echo "::error title=Cannot find $label::expected exactly one match for '$pattern', found $count"
              echo "--- tree of $BUNDLE ---"
              find "$BUNDLE" -maxdepth 3 -print || true
              exit 1
            fi
            printf '%s' "$matches"
          }
          DMG="$(one "$BUNDLE/dmg/*.dmg" "the DMG")"
          APP="$(one "$BUNDLE/macos/*.app" "the .app")"
          ARCHIVE="$(one "$BUNDLE/macos/*.app.tar.gz" "the updater archive")"
          {
            echo "dmg=$DMG"
            echo "app=$APP"
            echo "archive=$ARCHIVE"
          } >> "$GITHUB_OUTPUT"
          ls -l "$DMG" "$ARCHIVE" "$ARCHIVE.sig" 2>&1 || true

      # ── 8b. The page that reaches her before macOS refuses the app ────────
      # ██ INVERTED 2026-09-05 ██ This read: "D1 ships unsigned on purpose, so the
      # Gatekeeper rejection two steps down is the expected state — and it is why
      # LZP-106's guided unlock screen exists." D1 is reversed, so on the signed
      # branch that rejection is now a BUILD FAILURE (step 10) rather than an
      # expectation. The page stays, and not out of sentiment: it is the fallback
      # for the day the certificate expires, and the ad-hoc branch still produces
      # exactly the rejection it was written for. The screen it duplicates is
      # inside the app macOS would refuse, so the DMG window is the one surface
      # that reaches her first; double-clicking an HTML file opens Safari, which
      # Gatekeeper does not block.
      #
      # ⚠ THIS STEP REWRITES THE IMAGE (hdiutil convert + mv, dmg-add-readme.sh:123).
      # Any notarization ticket Tauri stapled to the DMG is discarded here. Step 9b
      # is what puts one back, and it must stay between this step and the gates.
      #
      # This is a post-bundle step because Tauri offers nothing else, and that was
      # checked rather than assumed: bundle.macOS.dmg is "additionalProperties": false
      # with five keys, bundle.resources copies into the .app and not onto the image,
      # and the bundler rewrites its vendored create-dmg script from an include_str!
      # on every run. The full evidence is in the script's header.
      #
      # It runs before every gate below so that everything downstream — the mount
      # check, the size budget, the checksum, the upload — sees the artifact that
      # actually ships.
      - name: Put the unlock page on the DMG
        run: .github/scripts/dmg-add-readme.sh '${{ steps.art.outputs.dmg }}'

      # ── 9. Gate: the bundle is actually signed with something ─────────────
      - name: The .app carries a code signature
        run: |
          APP='${{ steps.art.outputs.app }}'
          if ! codesign --verify --verbose=2 "$APP" 2>&1; then
            echo "::error title=Unsigned bundle::$APP has no valid code signature. On Apple silicon macOS kills unsigned binaries at launch, so this build would not start on a modern Mac. If Apple signing is off, the ad-hoc identity ('-') did not take: check that Tauri honoured APPLE_SIGNING_IDENTITY, and see docs/v2/RELEASE.md section 'Known unknowns'."
            exit 1
          fi
          codesign -dv --verbose=2 "$APP" 2>&1 | sed 's/^/  /'

      # ── 9b. Gate: notarization happened, and the ticket is ON these files ─
      #
      # ██ THE STEP THIS FILE WAS MISSING UNTIL 2026-09-05 ██
      #
      # Tauri's bundler does set the hardened runtime and does invoke notarytool
      # when APPLE_API_* are present. That was never the problem. The problem was
      # that NOTHING IN THIS REPOSITORY ASSERTED IT WORKED — the only Gatekeeper
      # check was the informational `spctl … || true` in the step below — and that
      # one step actively broke it: `dmg-add-readme.sh` rewrites the image AFTER
      # the bundler built it (hdiutil convert + mv) and re-signs it.
      # `codesign --force --sign` puts a signature back. IT CANNOT PUT A STAPLE
      # BACK. A notarization that silently fails ships a DMG that presents to a
      # non-technical family member exactly as the unsigned build did — the one
      # outcome the 99 EUR was spent to avoid, arriving as a green pipeline.
      #
      # So the rewritten image gets its OWN ticket, here, after the rewrite, and
      # every failure below is hard. This sequence is not invented: it is what the
      # PO performed by hand on 2026-09-05 (codesign --options runtime --timestamp,
      # notarytool submit --wait, stapler staple, spctl --assess -> accepted /
      # source=Notarized Developer ID). It lived in his head and in one brief. Now
      # it lives here, where `git tag` can repeat it and where it fails loudly
      # instead of quietly.
      #
      # Ordering matters twice over and both are load-bearing:
      #   · AFTER  the read-me injection (step 8b) — the image it stapled would
      #            otherwise be thrown away by the `mv` at dmg-add-readme.sh:123.
      #   · BEFORE the mount gate (step 10) — so the DMG every gate below inspects,
      #            measures, hashes and uploads is the stapled one.
      - name: Notarize the rewritten DMG, staple it, and prove both tickets
        if: vars.ENABLE_APPLE_SIGNING == 'true'
        env:
          DMG: ${{ steps.art.outputs.dmg }}
          APP: ${{ steps.art.outputs.app }}
          API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          # ── the hardened runtime, asserted rather than assumed ──────────────
          # Notarization REFUSES a bundle without it, so a missing runtime flag
          # here is the cause of the notarytool rejection three lines down — and
          # saying so now costs a second and saves reading a submission log.
          #
          # ██ CORRECTED 2026-09-05, integration pass ██
          # What stood here, verbatim, and what was wrong with it:
          #
          #   > if ! codesign -d --verbose=2 "$APP" 2>&1 | grep -q 'flags=.*runtime'; then
          #
          # THAT LINE FAILED ON A CORRECTLY HARDENED BUNDLE. Measured against the
          # real notarized /Applications/LangzeitPlaner.app, not against a stub:
          # `codesign -d --verbose=2` prints sixteen lines, `flags=0x10000(runtime)`
          # is the fourth, `grep -q` exits the instant it matches and closes the
          # read end, and codesign takes SIGPIPE on the fifth line —
          #
          #     pipeline rc=141   PIPESTATUS=(141 0)      141 = 128 + SIGPIPE
          #
          # This step runs `set -euo pipefail`, so 141 is the pipeline's status and
          # `if !` takes the failure branch. The gate would have hard-failed the
          # FIRST signed release, printing "carries no hardened-runtime flag"
          # immediately above a dump containing `flags=0x10000(runtime)` — a gate
          # that fails closed on the honest path is not a stricter gate, it is a
          # pipeline that cannot ship. It survived review because a stubbed
          # `codesign` exits before the reader does and never raises SIGPIPE.
          #
          # Capture once, then grep the file. That is already how step 10 reads
          # `spctl`, for this exact reason, and it drops the second codesign run.
          SIGINFO="$RUNNER_TEMP/codesign-app.txt"
          codesign -d --verbose=2 "$APP" > "$SIGINFO" 2>&1 || true
          if ! grep -q 'flags=.*runtime' "$SIGINFO"; then
            echo "::error title=No hardened runtime::$APP is signed but carries no hardened-runtime flag, and Apple will not notarize such a bundle. Tauri sets it when APPLE_SIGNING_IDENTITY names a real Developer ID; check the 'Enable signing and notarization' step actually exported it, and see docs/v2/RELEASE.md section 'Turning Apple signing on'."
            sed 's/^/  /' "$SIGINFO"
            exit 1
          fi
          echo "  hardened runtime: present on $(basename "$APP")"

          # ── submit the image that will actually ship ────────────────────────
          OUT="$RUNNER_TEMP/notarize.json"
          RC=0
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" \
            --wait --timeout 30m \
            --output-format json > "$OUT" 2>"$RUNNER_TEMP/notarize.err" || RC=$?
          sed 's/^/  /' "$RUNNER_TEMP/notarize.err" || true
          STATUS="$(node -p "try{JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).status||''}catch(e){''}" "$OUT")"
          SUBMISSION="$(node -p "try{JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).id||''}catch(e){''}" "$OUT")"
          echo "  notarytool: status=${STATUS:-<none>} id=${SUBMISSION:-<none>} rc=$RC"
          if [ "$RC" != "0" ] || [ "$STATUS" != "Accepted" ]; then
            if [ -n "$SUBMISSION" ]; then
              echo "--- notarization log ---"
              xcrun notarytool log "$SUBMISSION" \
                --key "$APPLE_API_KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" 2>&1 | sed 's/^/  /' || true
            fi
            echo "::error title=Notarization failed::Apple did not accept $(basename "$DMG") (status ${STATUS:-unknown}, exit $RC). Publishing anyway would ship a DMG that Gatekeeper refuses exactly as it refused the unsigned build — the failure the Developer ID was bought to remove. The submission log is printed above; the usual causes are a missing hardened runtime, an unsigned nested binary, or an expired certificate."
            exit 1
          fi

          # ── staple, so a first launch works with no network ─────────────────
          # Without the ticket ON the file, Gatekeeper must ask Apple online. The
          # person this release is for opens the DMG on a hotel wifi captive portal
          # and meets the same wall the ticket was bought to remove.
          #
          # ██ CORRECTED 2026-09-05, integration pass ██  What stood here, verbatim:
          #
          #   > xcrun stapler staple "$DMG"
          #
          # The one bare command in a step where every other failure is named. Run
          # for real against a DMG Apple has no record of, it prints
          #
          #     CloudKit query for … failed due to "Record not found".
          #     The staple and validate action failed! Error 65.
          #
          # and `set -e` ends the step at exit 65 with no ::error annotation — so
          # GitHub shows "Process completed with exit code 65" and the cause is
          # four lines up in a collapsed log. And this failure is NOT hypothetical
          # after an Accepted status: the ticket is fetched from Apple's CDN, and
          # "Record not found" moments after acceptance is propagation lag, which
          # is a retry, not a rebuild. Say which it is.
          if ! xcrun stapler staple "$DMG" 2>&1 | sed 's/^/  /'; then
            echo "::error title=Stapling the DMG failed::Apple accepted $(basename "$DMG") (submission $SUBMISSION) but 'xcrun stapler staple' could not attach the ticket. If the log above says \"Record not found\", the ticket simply has not propagated to Apple's CDN yet — RE-RUN THIS JOB in a few minutes, do not rebuild and do not resubmit. Any other error means the file changed after it was submitted, and the fix is upstream of here."
            exit 1
          fi

          # ── validate BOTH, and hard-fail on either ──────────────────────────
          if ! xcrun stapler validate "$DMG" 2>&1 | sed 's/^/  /'; then
            echo "::error title=DMG staple did not take::xcrun stapler validate failed on $(basename "$DMG") immediately after stapling it. The image would be published without a ticket."
            exit 1
          fi
          if ! xcrun stapler validate "$APP" 2>&1 | sed 's/^/  /'; then
            echo "::error title=The .app carries no notarization ticket::stapler validate failed on $APP. Tauri notarizes and staples the .app during 'cargo tauri build' when APPLE_API_* are set; if that did not happen, the copy INSIDE the DMG has no ticket either — and stapling this outer .app now cannot reach it, because the image was built from a copy taken before this step. Do not patch it here: fix the bundler step and rebuild. Check the 'Build universal bundle' log for notarytool output."
            exit 1
          fi
          {
            echo "### Notarization"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| submission | \`$SUBMISSION\` |"
            echo "| status | **$STATUS** |"
            echo "| stapled | \`$(basename "$DMG")\` and \`$(basename "$APP")\`, both validated |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 10. Gate: the DMG mounts, and what is inside is the app ───────────
      # A DMG that will not mount is a total failure that no unit test can see
      # and that the PO would discover by watching Mom double-click it.
      - name: The DMG mounts and contains the app
        env:
          # Read inside the script rather than as a step-level `if:`, because this
          # step runs on both branches and only the Gatekeeper verdict at the end
          # of it differs between them. `rejected` is the CORRECT answer ad hoc.
          SIGNED: ${{ vars.ENABLE_APPLE_SIGNING }}
        run: |
          DMG='${{ steps.art.outputs.dmg }}'
          MNT="$RUNNER_TEMP/dmgcheck"
          mkdir -p "$MNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          trap 'hdiutil detach "$MNT" -force >/dev/null 2>&1 || true' EXIT
          ls -la "$MNT"
          INNER="$MNT/LangzeitPlaner.app"
          if [ ! -d "$INNER" ]; then
            echo "::error title=DMG has no app::LangzeitPlaner.app is not at the root of the mounted DMG. 22.1's 'open, drag to Programme' does not work."
            exit 1
          fi
          if [ ! -L "$MNT/Applications" ]; then
            echo "::warning title=No Applications shortcut::The DMG has no /Applications symlink, so 'drag to Programme' has nowhere to drop. Check bundle.macOS.dmg settings."
          fi

          # ── the window is actually styled (LZP-107) ─────────────────────────
          # Tauri lays the DMG out by sending Apple events to Finder. On a runner
          # with no usable Finder session that is refused with `-1743 Not authorized
          # to send Apple events to Finder`, and the bundler goes on to emit a DMG
          # that is valid, installable, and completely unstyled: no background, no
          # arrow, icons wherever Finder feels like putting them. Nothing in the
          # build fails. Story 22.1's designed window would simply be gone, and the
          # first person to find out would be Mom.
          #
          # Two fingerprints, checked separately because they fail separately:
          #   .background/background.tiff  the art was copied in
          #   .DS_Store                    Finder wrote the view settings back
          if [ ! -f "$MNT/.background/background.tiff" ]; then
            echo "::error title=DMG has no background::.background/background.tiff is missing from the mounted image. Either the 'Build release artwork' step did not run, or bundle.macOS.dmg.background does not point at src-tauri/dmg/background.tiff."
            exit 1
          fi
          # ── .DS_Store — A WARNING, BECAUSE THIS GATE CANNOT PASS ON A RUNNER ────────────────
          #
          # It was `exit 1`, and on 2026-09-11 it stopped the first release that ever got this far:
          # a correct DMG, notarized and stapled, rejected for a cosmetic reason. Laying out a DMG
          # window means driving Finder over Apple events, and a GitHub macOS runner has no GUI
          # session to drive — it fails -1743, "Not authorized to send Apple events". That is not a
          # misconfiguration anyone can fix from here; it is what the runner is. A gate that can
          # only be satisfied by not running is the same trap tier 2 was in, and the same answer
          # applies: say what is true, loudly, and let the things that MATTER stay hard.
          #
          # What is lost when it is absent: the window opens as a plain folder instead of showing
          # the background art with the app and the Programme alias positioned on it. What is NOT
          # lost, and is checked above and below as hard failures: the app itself, the Applications
          # symlink that makes "drag to Programme" work at all, the background file, the volume
          # icon, and „Bitte zuerst lesen.html". Every functional part of story 22.1 survives an
          # unstyled window; only the styling does not.
          #
          # `scripts/make-dmg.sh` has always behaved this way for the same reason — "The DMG is
          # valid and installable; it will open unstyled" — so this brings the two paths into
          # agreement rather than inventing a new tolerance.
          if [ ! -f "$MNT/.DS_Store" ]; then
            echo "::warning title=DMG window is unstyled::The image has no .DS_Store, so Finder never applied the icon positions or the background: it will open as a plain folder listing. This is the Apple-events failure (-1743) and it is EXPECTED on a GitHub runner, which has no GUI session. The DMG is valid, notarized and installable, and every functional element is present and checked. To ship a styled window, build the DMG on a Mac with a desktop session (scripts/make-dmg.sh) and attach that artifact instead."
          else
            echo "  DMG window: background present, view settings written."
          fi

          # ── the page a blocked user can still open (LZP-106 / LZP-107) ──────
          # Decision D1 ships unsigned, so the Gatekeeper assessment printed below
          # says "rejected" — correctly. The screen that walks somebody past that
          # wall is inside the app macOS has just refused to launch, so the ONLY
          # surface that reaches her first is this DMG window. E10's audit named it:
          # "step 3 of the e-mail is the only surface reaching a stranger before
          # macOS refuses the app" — and an e-mail can be lost, forwarded without
          # its body, or read on a phone. The page cannot be.
          READ_NAME="Bitte zuerst lesen.html"
          if [ ! -f "$MNT/$READ_NAME" ]; then
            echo "::error title=DMG has no instructions on it::\"$READ_NAME\" is not at the root of the mounted DMG, so the first thing a non-technical person sees after macOS refuses this unsigned app is a window with an app icon, a folder, and nothing that explains the warning. Fix in this order: (1) did 'Build release artwork' run? it calls scripts/build-unlock-page.sh, which writes build/dmg/$READ_NAME; (2) did that script take its 'src/js/firstrun.js does not exist yet' early exit? (3) did the 'Put the unlock page on the DMG' step above run and succeed? Do not publish without it — see docs/v2/invitation-email.md section 8.2."
            exit 1
          fi
          echo "  read-me: $READ_NAME present ($(stat -f%z "$MNT/$READ_NAME") bytes)."
          codesign --verify --verbose=2 "$INNER" 2>&1 | sed 's/^/  /'

          # ── the Gatekeeper verdict, and it is a GATE now on one branch ──────
          #
          # ██ INVERTED 2026-09-05 ██  What stood here, verbatim:
          #
          #   > # Diagnostic only. Unsigned, this WILL say "rejected" — that is the
          #   > # expected state under D1 and exactly the wall LZP-106 walks Mom past.
          #   > echo "Gatekeeper assessment (informational):"
          #   > spctl --assess --type execute --verbose=4 "$INNER" 2>&1 | sed 's/^/  /' || true
          #
          # That reasoning was RIGHT under D1 and is still right on the ad-hoc
          # branch, where it is kept below unchanged: with no Developer ID the
          # only honest answer is `rejected`, and failing the build on it would
          # mean no build at all. D1 is reversed. On the signed branch the same
          # `|| true` turns the ONE command that can tell a stapled DMG from an
          # unstapled one into a comment — the pipeline's whole capacity to lie
          # about notarization was in those seven characters.
          #
          # Two assessments, because a Mac performs two:
          #   --type execute   the app, once she has dragged it to Programme
          #   --type open --context context:primary-signature
          #                    the DOWNLOADED IMAGE, which is the first thing
          #                    macOS judges and the one nothing here ever ran
          if [ "$SIGNED" = "true" ]; then
            APP_OUT="$RUNNER_TEMP/spctl-app.txt"
            RC=0
            spctl --assess --type execute --verbose=4 "$INNER" > "$APP_OUT" 2>&1 || RC=$?
            sed 's/^/  /' "$APP_OUT"
            if [ "$RC" != "0" ]; then
              echo "::error title=Gatekeeper rejects the app::spctl --assess --type execute said no (exit $RC) on a build that signing and notarization were switched on for. Shipping this DMG puts the PO's mother in front of exactly the wall the Developer ID was bought to remove, with nothing in the release notes warning her. Check the notarization step above and 'stapler validate'."
              exit 1
            fi
            if ! grep -q 'source=Notarized Developer ID' "$APP_OUT"; then
              echo "::error title=Accepted, but not as a notarized app::spctl accepted $INNER without saying 'source=Notarized Developer ID'. That is what a locally-trusted or developer-exempt assessment looks like on a build machine — it does NOT transfer to a stranger's Mac. The verdict this release needs is 'accepted' AND 'source=Notarized Developer ID'."
              sed 's/^/  /' "$APP_OUT"
              exit 1
            fi
            DMG_OUT="$RUNNER_TEMP/spctl-dmg.txt"
            RC=0
            spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG" > "$DMG_OUT" 2>&1 || RC=$?
            sed 's/^/  /' "$DMG_OUT"
            if [ "$RC" != "0" ] || ! grep -q 'source=Notarized Developer ID' "$DMG_OUT"; then
              echo "::error title=Gatekeeper rejects the downloaded image::spctl --assess --type open --context context:primary-signature failed on $(basename "$DMG") (exit $RC). This is the assessment a file that arrived by download or e-mail actually receives, and it is the only one that sees the read-me injection's rewrite: the .app can be perfectly notarized while the image around it is not."
              exit 1
            fi
            echo "  Gatekeeper: accepted, notarized Developer ID, both the app and the image."
          else
            # Ad-hoc: `rejected` is the correct answer and must not fail the build.
            # This is the wall LZP-106's guided unlock screen walks Mom past.
            echo "Gatekeeper assessment (informational — no Developer ID, rejection expected):"
            spctl --assess --type execute --verbose=4 "$INNER" 2>&1 | sed 's/^/  /' || true
          fi

      # ── 11. Gate: the size budget (22.1) ──────────────────────────────────
      - name: DMG size budget
        run: |
          DMG='${{ steps.art.outputs.dmg }}'
          BYTES=$(stat -f%z "$DMG")
          MIB=$(node -p "($BYTES/1048576).toFixed(2)")
          ENCODED=$(node -p "Math.round($BYTES*1.36)")
          ENC_MB=$(node -p "($ENCODED/1000000).toFixed(2)")
          {
            echo "### DMG size"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| file | \`$(basename "$DMG")\` |"
            echo "| on disk | **$MIB MiB** ($BYTES bytes) |"
            echo "| as a mail attachment (base64) | ~$ENC_MB MB |"
            echo "| fits GMX / Web.de / T-Online (20 MB) | $([ "$ENCODED" -le 20000000 ] && echo yes || echo '**no**') |"
            echo "| fits Gmail / iCloud (25 MB) | $([ "$ENCODED" -le 25000000 ] && echo yes || echo '**no**') |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DMG $MIB MiB, ~$ENC_MB MB encoded"
          if [ "$BYTES" -gt "$DMG_FAIL_BYTES" ]; then
            echo "::error title=DMG too large to email::$MIB MiB exceeds the $(node -p "($DMG_FAIL_BYTES/1048576).toFixed(0)") MiB ceiling. Encoded that is ~$ENC_MB MB, past every consumer mailbox, and story 22.1's 'one email attachment and one drag' stops being true. Find the weight before shipping: 'du -sh' inside the .app, and check assets/ and the icon set first."
            exit 1
          fi
          if [ "$BYTES" -gt "$DMG_WARN_BYTES" ]; then
            echo "::warning title=DMG over the 20 MB-provider budget::$MIB MiB is ~$ENC_MB MB once base64-encoded, which GMX, Web.de and T-Online will reject. It still fits Gmail and iCloud. The invitation email (deliverable 28) must lead with the GitHub Releases link rather than the attachment."
          fi

      # ── 12. Stage artifacts under names the manifest can point at ─────────
      #
      # THE STAGING DIRECTORY IS NOT `dist/`, AND THAT IS THE WHOLE POINT.
      #
      # `src-tauri/tauri.conf.json` runs `node scripts/build-frontend.mjs` as its
      # beforeBuildCommand, and that script owns `<repo>/dist`: it `rm -rf`s the
      # directory and refills it with the web payload (`index.html` and `src/`,
      # 3 598 KiB in 83 files, measured 2026-09-05). So by the time step 7
      # finishes, `dist/` is FULL — of the
      # frontend, not of anything a human downloads. Staging release artifacts
      # into the same directory produced three real defects, all of them shipped:
      #
      #   · `shasum -a 256 dist/*` hashed `dist/index.html`, and SHA256SUMS.txt is
      #     pasted verbatim into the public release notes below. The notes told
      #     the reader the checksum of a file that is not in the release.
      #   · the same glob handed `shasum` the `dist/src` DIRECTORY, which exits
      #     non-zero with `Is a directory` — invisible, because the step ended in
      #     `| tee` and GitHub runs `run:` as `bash -e {0}`, NOT `pipefail`, so
      #     the pipeline's status was tee's zero. See the checksum block below.
      #   · `upload-artifact` took `path: dist/`, so every rehearsal shipped the
      #     entire web payload beside the DMG.
      #
      # The fix is a directory the frontend build never touches — NOT a narrower
      # glob, which the next artifact re-opens. `build/` is already gitignored and
      # already the release's scratch space (build/dmg, build/email), so the
      # staged tree lives at `build/release`. `tests/tier1/release-staging.test.js`
      # fails if this directory and `build-frontend.mjs`'s output are ever the
      # same, or nested one inside the other, from EITHER side.
      #
      # `dir` is a step output so that every consumer below names the directory
      # once, from here. There is exactly one literal in this workflow.
      - name: Stage release artifacts
        id: stage
        run: |
          # A checksum step that cannot fail is not a checksum step. Everything
          # below runs with pipefail on, so a broken producer at the head of a
          # pipeline fails the step instead of being swallowed by its tail.
          set -o pipefail
          V='${{ steps.v.outputs.version }}'
          STAGE=build/release
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          DMG_NAME="LangzeitPlaner-$V-universal.dmg"
          ARCHIVE_NAME="LangzeitPlaner-$V-universal.app.tar.gz"
          cp '${{ steps.art.outputs.dmg }}' "$STAGE/$DMG_NAME"
          cp '${{ steps.art.outputs.archive }}' "$STAGE/$ARCHIVE_NAME"
          cp '${{ steps.art.outputs.archive }}.sig' "$STAGE/$ARCHIVE_NAME.sig"
          {
            echo "dmg_name=$DMG_NAME"
            echo "archive_name=$ARCHIVE_NAME"
            echo "dir=$STAGE"
          } >> "$GITHUB_OUTPUT"

          # Only regular files, and only the ones put here on purpose. This is the
          # `Is a directory` failure made loud: a directory in the staging tree is
          # a mistake upstream, and it must stop the release rather than produce a
          # checksum list with a hole in it.
          for f in "$STAGE"/*; do
            if [ ! -f "$f" ]; then
              echo "::error title=Staging tree has a non-file::'$f' is not a regular file. The staging directory holds exactly the assets that get published; a directory in it means something copied a tree in here, and 'shasum' would exit non-zero on it. Do not widen the glob — find what put it there."
              exit 1
            fi
          done

          # Checksums are taken FROM INSIDE the staging directory so the public
          # release notes carry bare asset names — the names a reader actually
          # downloads — and no internal build path. Written with a redirect, not
          # `| tee`: the redirect makes shasum's own exit status the step's.
          ( cd "$STAGE" && shasum -a 256 -- * ) > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" "$STAGE/SHA256SUMS.txt"
          cat "$STAGE/SHA256SUMS.txt"

      # ── 13. The update manifest — signed, or it does not exist (22.6) ────
      # The generator verifies the .sig against the public key embedded in the
      # app it just built, and only then does it have a value for the
      # `signature` field. There is no path through it that emits an unsigned
      # entry. A key mismatch here means the build would ship an app that
      # rejects every future update — caught now instead of in six months.
      #
      # LZP_MIN_CLIENT_VERSION is a repository variable so that story 22.7's
      # minimum-client gate can be raised without touching any file. Leave it
      # unset for a normal release.
      - name: Generate and verify latest.json
        env:
          # Set ONLY for a key-rotation release, and unset again straight after.
          # See docs/v2/RELEASE.md § "Rotating the updater key".
          ROTATION_PUBKEY: ${{ vars.LZP_ROTATION_VERIFY_PUBKEY }}
          # Named once, in step 12. Never spelled again.
          STAGE: ${{ steps.stage.outputs.dir }}
        run: |
          set -o pipefail
          EXTRA=()
          if [ -n "$ROTATION_PUBKEY" ]; then
            EXTRA+=(--pubkey "$ROTATION_PUBKEY")
            echo "::warning title=Key-rotation release::Repository variable LZP_ROTATION_VERIFY_PUBKEY is set, so the update artifact is verified against the PREVIOUS key. Delete that variable immediately after this release or the guard stays weakened."
          fi
          node .github/scripts/make-update-manifest.mjs \
            --version '${{ steps.v.outputs.version }}' \
            --repo "$GITHUB_REPOSITORY" \
            --tag '${{ steps.v.outputs.tag }}' \
            --archive '${{ steps.art.outputs.archive }}' \
            --asset-name '${{ steps.stage.outputs.archive_name }}' \
            --min-client-version "${{ vars.LZP_MIN_CLIENT_VERSION || '0.0.0' }}" \
            --notes "LangzeitPlaner ${{ steps.v.outputs.version }}" \
            --out "$STAGE/latest.json" \
            "${EXTRA[@]}"
          echo '### Update manifest' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const m = JSON.parse(require("node:fs").readFileSync(process.env.STAGE + "/latest.json", "utf8"));
            for (const k of Object.keys(m.platforms)) m.platforms[k].signature = m.platforms[k].signature.slice(0, 24) + "… (verified)";
            console.log(JSON.stringify(m, null, 2));
          ' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── 14. Keep the build even when nothing is published ────────────────
      # `path:` is the staging directory, so a rehearsal's artifact is the five
      # files a human would download and nothing else. It used to be `dist/`,
      # which is the frontend build's output — every rehearsal carried the whole
      # 3 598 KiB web payload beside the DMG.
      - name: Upload build output to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: langzeitplaner-${{ steps.v.outputs.version }}-macos-universal
          path: ${{ steps.stage.outputs.dir }}/
          retention-days: 14
          if-no-files-found: error

      # ── 15. Publish (tag pushes only) ─────────────────────────────────────
      # A prerelease tag (v2.0.0-rc.1) publishes as a prerelease, which means
      # `releases/latest/download/latest.json` does NOT resolve to it and the
      # family fleet stays where it is. That is how a release is rehearsed on
      # one Mac before it reaches Mom's.
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
          # Named once, in step 12. Never spelled again.
          STAGE: ${{ steps.stage.outputs.dir }}
        run: |
          set -o pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "**LangzeitPlaner $VERSION** — macOS 12 or newer, Intel and Apple silicon."
            echo ""
            echo "Installieren: DMG öffnen, App nach *Programme* ziehen, starten."
            echo "Beim ersten Start führt die App durch die Freigabe in den Systemeinstellungen."
            echo ""
            echo "Install: open the DMG, drag the app to *Applications*, launch it."
            echo "On first launch the app walks you through the Systemeinstellungen unlock."
            echo ""
            echo "Bereits installiert? Nichts tun — die App aktualisiert sich selbst."
            echo "Already installed? Do nothing — the app updates itself."
            echo ""
            echo '```'
            # Bare asset names, because step 12 hashed from inside the staging
            # directory. This block is public, and it used to carry a line for
            # `dist/index.html` — a file that is not in the release at all.
            cat "$STAGE/SHA256SUMS.txt"
            echo '```'
          } > "$NOTES"

          ARGS=(--title "LangzeitPlaner $VERSION" --notes-file "$NOTES")
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
            echo "::notice title=Prerelease::$TAG is a prerelease. releases/latest/download/latest.json will NOT point at it, so no device updates to it automatically."
          fi

          gh release create "$TAG" \
            "$STAGE/${{ steps.stage.outputs.dmg_name }}" \
            "$STAGE/${{ steps.stage.outputs.archive_name }}" \
            "$STAGE/${{ steps.stage.outputs.archive_name }}.sig" \
            "$STAGE/latest.json" \
            "$STAGE/SHA256SUMS.txt" \
            "${ARGS[@]}"

      # ── 16. Prove the published manifest is reachable ─────────────────────
      # The updater endpoint is `releases/latest/download/latest.json`. That URL
      # resolves only for the newest NON-prerelease release, and a release with
      # a missing or misnamed asset is a fleet that silently stops updating.
      # One curl closes that gap.
      - name: The published manifest resolves
        if: github.ref_type == 'tag' && steps.v.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Named once, in step 12. Never spelled again.
          STAGE: ${{ steps.stage.outputs.dir }}
        run: |
          set -o pipefail
          URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$URL" -o "$RUNNER_TEMP/published.json"; then break; fi
            echo "attempt $attempt: not there yet"
            sleep 10
          done
          if [ ! -s "$RUNNER_TEMP/published.json" ]; then
            echo "::error title=Manifest not reachable::$URL did not resolve. Every installed app polls this URL; if it 404s the fleet is stranded on its current version."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const published = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const local = JSON.parse(fs.readFileSync(process.env.STAGE + "/latest.json", "utf8"));
            if (published.version !== local.version) {
              console.error(`::error::published manifest says ${published.version}, this build is ${local.version}`);
              process.exit(1);
            }
            for (const [k, v] of Object.entries(published.platforms)) {
              if (!v.signature) { console.error(`::error::published manifest: ${k} has no signature`); process.exit(1); }
            }
            if (!published.platforms["darwin-universal"]) {
              console.error("::error::published manifest has no darwin-universal entry — that is the key every client looks up, so the fleet would see no update at all");
              process.exit(1);
            }
            console.log(`published manifest OK: ${published.version}, minimum_version ${published.minimum_version}, platforms ${Object.keys(published.platforms).join(", ")}`);
          ' "$RUNNER_TEMP/published.json"
