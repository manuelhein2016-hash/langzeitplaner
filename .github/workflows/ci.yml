name: CI

# The suite gate. Runs on every branch and every pull request, and is called by
# release.yml so that a `git tag` can never publish a build whose tests are red
# (story 22.8 — one tag moves the whole family forward; it had better be green).
#
# No `npm ci` anywhere in this file. The app has zero runtime dependencies and
# the test runner is `node --test` from the standard library, so there is
# nothing to install. If a step here ever needs an install, that is the signal
# that something slipped in — see PLAN.md §7, Gate 5+.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: Suites — tier 1, property, attack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 — THE ORACLE IS IN THE HISTORY, NOT IN THE TREE.
      #
      # `tests/attack/v1-frozen-store.test.js:34` re-derives the frozen v1 store by shelling out
      # to `git show 66126e9:src/js/store.js` and comparing it byte-for-byte with the vendored
      # copy. That is what stops the v1 characterization oracle from quietly drifting into
      # agreement with whatever v2 happens to do — the whole regression argument rests on it.
      #
      # `actions/checkout@v4` clones at depth 1 by default, so the baseline commit is simply not
      # there and the row fails with a git error rather than a drift report. Found on the second
      # push, 2026-09-05. A shallow clone would have let the oracle rot invisibly on CI while
      # every developer machine kept checking it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: No dependencies were installed
        run: |
          if [ -d node_modules ]; then
            echo "::error::node_modules exists on a clean checkout — a dependency was committed"
            exit 1
          fi
          echo "clean checkout, nothing installed"

      - name: tier 1
        run: npm test
      - name: property
        run: npm run test:property
      - name: attack
        run: npm run test:attack

  dom:
    name: Tier 2 — real WKWebView
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Builds shell-macos/ with swiftc and drives it headless. If a hosted
      # runner turns out not to give WKWebView a usable window server, the
      # honest fix is one line — `continue-on-error: true` here, plus a note in
      # docs/v2/RELEASE.md § "Known unknowns" — not deleting the job.
      - name: tier 2
        run: npm run test:dom

  shell-rust:
    name: Tier 0 — the shell PRODUCTION ships actually compiles
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════════════════════
      # WHY THIS JOB EXISTS
      # ═══════════════════════════════════════════════════════════════════════
      #
      # Until 2026-09-04 this workflow had FOUR jobs and not one of them ran
      # `cargo`. `src-tauri/` had never been compiled by anybody — the audit's
      # own "what was not audited" section said so: "whether `src-tauri/`
      # compiles at all [is] unmeasured by anybody. The Rust shell is reviewed,
      # never executed."
      #
      # That is not a small gap, because the two shells are not equal in status:
      # `shell-macos/main.swift` is what every measurement in this project used
      # and what `scripts/make-dmg.sh` packages, but `src-tauri/src/lib.rs` is
      # what `release.yml` actually ships (`cargo tauri build`). The only
      # workflow that compiled the production shell ran on a TAG — so the first
      # time anyone would have learned it was broken is the release itself.
      #
      # It WAS broken. Measured 2026-09-04 on rustc 1.98.1 / cargo 1.98.1, a
      # clean `cargo check` failed before rustc ever looked at lib.rs:
      #
      #     error: failed to run custom build command for `langzeitplaner`
      #     The `tauri` dependency features on the `Cargo.toml` file does not
      #     match the allowlist defined under `tauri.conf.json`.
      #     Please run `tauri dev` or `tauri build` or remove the
      #     `macos-private-api` feature.
      #
      # `Cargo.toml` declared `features = ["tray-icon", "macos-private-api"]`
      # while `tauri.conf.json` declared `"macOSPrivateApi": false`. Because it
      # is a BUILD SCRIPT failure it happens before type checking, so no amount
      # of reading lib.rs could find it, and `tests/helpers/helper-hygiene.js`'s
      # `SHELL_RUST` gate could not either — that gate compares Swift and Rust
      # TEXTUALLY, and a text gate cannot catch a manifest that disagrees with a
      # config file. Only a compiler catches this. Hence: a compiler, on every
      # push, not on a tag.
      #
      # Deliberately cheap and dependency-free:
      #   · no `npm ci` — the app has zero runtime dependencies (see the header)
      #   · no frontend build — MEASURED 2026-09-04: with `dist/` absent (it is
      #     gitignored, so it is absent on every clean checkout) `build.rs`
      #     re-ran and `cargo check --all-targets --locked` still exited 0. The
      #     dev profile does not embed the frontend; only a release
      #     `tauri build` does, and that is `release.yml`'s job.
      #   · no third-party actions — the macos-14 runner ships a Rust toolchain,
      #     and the cache action is first-party.
      - name: A Rust toolchain exists, and say which one
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error title=No Rust toolchain::The macos-14 runner did not provide cargo. Install one here rather than deleting this job — without it the shell production ships goes back to being unverified."
            exit 1
          fi
          rustc -vV
          cargo -V

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # THE ICONS MUST EXIST BEFORE cargo TOUCHES THE CRATE, and they are not committed.
      #
      # `tauri-build` runs in build.rs and reads `bundle.icon` -> src-tauri/icons/icon.png.
      # Nothing image-shaped is in git on purpose (RELEASE.md: "so nothing image-shaped can be
      # stale or unreproducible"), so on a clean checkout that file does not exist and the crate
      # fails in a PROC MACRO, before rustc reads a line of lib.rs:
      #
      #     error: proc macro panicked
      #       = help: message: failed to open icon .../src-tauri/icons/icon.png: No such file
      #
      # release.yml:231-233 already knows this — "This MUST run before `tauri build`" — but this
      # job did not, so the one job whose entire purpose is proving the production shell compiles
      # could never have passed on a clean runner. It passed locally only because a developer
      # machine has already built the assets. Found on the first push, 2026-09-05.
      - name: Build the artwork the crate's build script reads
        run: ./scripts/build-release-assets.sh

      # `--locked` requires src-tauri/Cargo.lock to be COMMITTED. It is, as of
      # this change. Without it every build resolves dependency versions afresh,
      # which is how "compiles today" quietly becomes "broke on the tag nobody
      # could reproduce". If you ever see "the lock file needs to be updated"
      # here, run `cargo check` locally and commit the resulting Cargo.lock —
      # do NOT drop `--locked`.
      #
      # `-D warnings` is a real gate and it is green: measured 2026-09-04,
      # `RUSTFLAGS="-D warnings" cargo check --all-targets --locked` exited 0
      # with zero warnings on 1,472 lines of lib.rs.
      - name: cargo check — does the production shell type-check
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked

      # `check` stops before codegen and linking. This is the step that proves
      # a binary actually comes out. Locally this produced a 55,942,992-byte
      # Mach-O arm64 executable — the first one this crate has ever produced.
      - name: cargo build — does it codegen and link
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked
          test -x src-tauri/target/debug/langzeitplaner \
            || { echo "::error title=No binary::cargo build reported success but produced no executable."; exit 1; }
          file src-tauri/target/debug/langzeitplaner

  release-config:
    name: Release config pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Non-strict: the placeholders that only a real release must resolve are
      # reported as notes here, so everyday CI stays green before the PO has a
      # GitHub remote and an updater key.
      - name: Versions agree, updater configured, still zero dependencies
        run: node .github/scripts/check-release-config.mjs

      - name: Signature verifier self-test
        run: node .github/scripts/minisign.selftest.mjs

      # Both are pure text/JSON checks with no Rust, no Swift and no image toolchain,
      # so they belong on the cheap ubuntu runner and run on every push -- not only
      # when a tag is cut. Catching a moved icon or a lost sentence at release time
      # means catching it after the artefact everyone is waiting for is already built.
      - name: DMG artwork and geometry agree (LZP-107)
        run: node .github/scripts/check-dmg-geometry.mjs

      - name: Invitation e-mail says what it must (LZP-108)
        run: node .github/scripts/check-email-copy.mjs

      # The cheap half of the `shell-rust` job, on the fast runner, so a manifest
      # that cannot build is reported in seconds rather than after a 45-minute
      # macOS Rust job. This is pure text and JSON — no cargo, no toolchain.
      #
      # It exists because of a real failure. Measured 2026-09-04, the FIRST time
      # anybody compiled src-tauri/: `tauri-build` aborts when the `tauri`
      # dependency's feature list disagrees with tauri.conf.json. `Cargo.toml`
      # declared `macos-private-api`; `tauri.conf.json` said
      # `"macOSPrivateApi": false`. Because it is a BUILD SCRIPT failure it
      # happens before rustc reads a line of lib.rs, so reviewing lib.rs could
      # never find it — and `helper-hygiene.js`'s SHELL_RUST gate could not
      # either, because it compares Swift to Rust textually and neither of these
      # two files is lib.rs.
      #
      # This is deliberately NOT a tier-1 test: tests/tier1/suite-integrity.test.js
      # requires every tier-1 file to import a real src/js module and forbids
      # node:fs, and a build-manifest check is neither. That rule is correct and
      # was left alone.
      - name: Cargo.toml and tauri.conf.json agree, or tauri-build will abort
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const toml = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const conf = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const line = toml.split('\n')
            .filter((l) => !l.trimStart().startsWith('#'))
            .find((l) => /^tauri\s*=/.test(l));
          if (!line) {
            console.log('::error title=No tauri dependency::src-tauri/Cargo.toml has no `tauri = …` line.');
            process.exit(1);
          }
          const m = line.match(/features\s*=\s*\[([^\]]*)\]/);
          const features = m ? [...m[1].matchAll(/"([^"]+)"/g)].map((x) => x[1]) : [];
          let bad = 0;
          // Every tauri feature that tauri-build cross-checks against the config.
          for (const [feature, read] of [['macos-private-api', (c) => c.app?.macOSPrivateApi === true]]) {
            const inToml = features.includes(feature);
            const inConf = read(conf);
            if (inToml !== inConf) {
              bad++;
              console.log(`::error title=Cargo.toml and tauri.conf.json disagree::Cargo.toml `
                + `${inToml ? 'declares' : 'does not declare'} the \`${feature}\` feature, but `
                + `tauri.conf.json resolves its counterpart to ${inConf}. tauri-build compares `
                + `these and FAILS THE BUILD before rustc reads lib.rs. Set both, or neither.`);
            }
          }
          // `image-png` (13.2): `Image::from_bytes` is behind it, and the tray needs it to carry a
          // real monochrome template glyph instead of the colour app icon. It has NO
          // tauri.conf.json counterpart, so it belongs in the known set and not in the pair list
          // above — nothing in the config can disagree with it.
          const known = new Set(['tray-icon', 'macos-private-api', 'devtools', 'isolation', 'image-png']);
          for (const f of features) {
            if (!known.has(f)) {
              bad++;
              console.log(`::error title=Unrecognised tauri feature::${f} is not in this check's `
                + `known set. If it has a tauri.conf.json counterpart, add the pair to the list `
                + `above — tauri-build fails the build when they disagree.`);
            }
          }
          if (bad) process.exit(1);
          console.log(`tauri features [${features.join(', ')}] agree with tauri.conf.json`);
          NODE

      # `shell-rust` passes `--locked`, which fails outright without a committed
      # lock. src-tauri/Cargo.lock did not exist until 2026-09-04, because
      # nothing had ever run cargo.
      - name: The Rust lockfile the --locked gate depends on is committed
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            echo "::error title=No Cargo.lock::src-tauri/Cargo.lock is missing, so the shell-rust job's \`--locked\` will fail. Run \`cargo check --manifest-path src-tauri/Cargo.toml\` and COMMIT the result. Do not drop --locked: without a lock every release resolves dependency versions afresh."
            exit 1
          fi
          grep -q '^name = "langzeitplaner"$' src-tauri/Cargo.lock \
            || { echo "::error title=Cargo.lock does not name this crate::src-tauri/Cargo.lock exists but does not contain the langzeitplaner package."; exit 1; }
          echo "src-tauri/Cargo.lock present, $(grep -c '^\[\[package\]\]' src-tauri/Cargo.lock) packages pinned"

      # R-9.1. `server.yml`'s path filter did not name `tests/server/**`, so the
      # workflow that runs the 998-row server suite was not triggered by an edit
      # to the server suite: a weakened assertion could be merged without
      # anything ever running it. The line is added; this is what keeps it
      # there. It derives the read set from server.yml itself — every script its
      # run: steps invoke, every npm script's glob and `--import` helper — so a
      # NEW step that reads a new directory fails here until the filter names
      # it, rather than the next time someone needed the guard.
      #
      #   node .github/scripts/check-ci-triggers.mjs --would-run <paths…>
      #
      # answers "would a push changing exactly these files have run it?", which
      # is how the hole was shown and how the repair was confirmed.
      - name: Every CI trigger covers what its jobs read (R-9.1)
        run: node .github/scripts/check-ci-triggers.mjs

  release-artwork:
    name: Release artwork builds from source
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No image is committed to this repository -- only SVG sources and this script.
      # That is only true for as long as the script keeps working, and it depends on a
      # macOS-13+ system SVG rasteriser reached through NSImage, which is exactly the
      # kind of undocumented convenience that disappears in a major release. If this
      # job goes red, the DMG background and the app icon cannot be rebuilt, and every
      # release after that point would ship whatever a developer happened to have in
      # their working tree.
      - name: Build every release image from its SVG source
        run: ./scripts/build-release-assets.sh --verbose

      - name: The files the bundler needs actually exist
        run: |
          set -e
          for f in src-tauri/icons/icon.icns \
                   src-tauri/dmg/background.tiff \
                   build/email/LangzeitPlaner-Installation.png; do
            [ -s "$f" ] || { echo "::error title=Missing release artwork::$f was not produced."; exit 1; }
          done
          # The icon must have an alpha channel. Deriving it from a flattened PNG
          # silently produces a white square -- and a white square looks exactly like
          # a build that worked.
          if ! sips -g hasAlpha src-tauri/icons/512x512.png | grep -q "hasAlpha: yes"; then
            echo "::error title=App icon has no transparency::The icon was rendered without an alpha channel, so it will show as a white square in the Dock, in Finder and in the DMG window. Check that assets/icon.svg is the source, not assets/icon-1024.png."
            exit 1
          fi
          # The hidpi TIFF must carry BOTH representations. With only the 1x rep the
          # background is soft on every Retina Mac; with only the 2x rep Finder draws
          # it at twice the window size and the layout is destroyed.
          DIRS=$(tiffutil -info src-tauri/dmg/background.tiff 2>/dev/null | grep -c "^Directory at" || true)
          if [ "$DIRS" != "2" ]; then
            echo "::error title=DMG background is not hidpi::background.tiff holds $DIRS image(s), expected 2 (660x420 and 1320x840). Check the tiffutil -cathidpicheck step in scripts/build-release-assets.sh."
            exit 1
          fi
          tiffutil -info src-tauri/dmg/background.tiff 2>/dev/null | grep -E "^Directory at|Image Width"
          echo "release artwork: ok"
