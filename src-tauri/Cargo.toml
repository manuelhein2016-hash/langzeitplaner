[package]
name = "langzeitplaner"
version = "2.0.0"
description = "Rolling 12-month whiteboard calendar"
edition = "2021"
rust-version = "1.77"

[lib]
name = "langzeitplaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` was declared here and `"macOSPrivateApi": false` in tauri.conf.json.
# `tauri-build` compares the two and ABORTS: "The `tauri` dependency features on the
# `Cargo.toml` file does not match the allowlist defined under `tauri.conf.json`." That is a
# build-script failure, so it happens before rustc ever looks at src/lib.rs — which is why no
# amount of reading this crate could find it and why `cargo tauri build` in release.yml would
# have failed on the first real tag. Measured 2026-09-04, rustc 1.98.1, cargo 1.98.1.
# The config is the half that is right: no window here is transparent and nothing calls
# `set_effects`, so the app does not need the private API. Removing the feature keeps the
# shipped behaviour and makes the two halves agree.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# LZP-102 (22.3, 22.6). The plugin owns the HTTPS GET, the minisign verification
# and the bundle swap — all in Rust, none of it inside the WebView, which is what
# lets the page keep `default-src 'self'` and 21.5 keep meaning something.
# UNVERIFIED: no cargo on the machine this was written on (PLAN.md risk R8).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# LZP-302 · ADR 002 §2.2 — the Keychain backstop (keychain_set/get/delete).
# A binding to the system Security framework; no network, no new runtime.
# UNVERIFIED: no cargo on the machine this was written on (PLAN.md risk R8).
# See the header above `keychain_set` in src/lib.rs — in particular, the
# accessibility class (`WhenUnlockedThisDeviceOnly`) that shell-macos/main.swift
# sets explicitly and this crate's convenience API does not expose.
security-framework = "3"
# LZP-1002 · ADR 003 §7 gate 3 — the Rust half of `sync_request` (see `syncPerform` in
# src/lib.rs). `tauri-plugin-updater` already pulls `reqwest` in for its own HTTPS GET, so this
# adds no new TLS stack; `default-features = false` + `rustls-tls` keeps it off the system
# OpenSSL and makes the build reproducible. `redirect(Policy::none())` is set at client
# construction — FINDING P-5's shell half, mirroring `SyncRequestDelegate` in main.swift.
# UNVERIFIED: no cargo on the machine this was written on (PLAN.md risk R8). The Swift half of
# the same contract IS verified end to end — docs/v2/SHELL-VERIFICATION.md.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# 12.4 · `print_board`. Tauri has no print API, so the shipped shell simply had no print command
# at all — `print.js` invoked one, Tauri rejected it, and CmdOrCtrl+P did nothing, silently, in
# every DMG. `shell-macos/main.swift:2468-2487` does it with NSPrintOperation; this is the same
# call sequence through objc2. Both crates are ALREADY in Cargo.lock at these exact versions —
# `tauri` itself depends on them for macOS — so this adds a direct edge and no new tree.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"          # 22.2 · getxattr, for the one quarantine probe (already in Cargo.lock)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSView", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSDictionary"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
