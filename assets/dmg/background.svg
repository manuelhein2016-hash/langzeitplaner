<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420">
<!--
  LZP-107 · DMG window background. Committed source; the PNG/TIFF are generated by
  scripts/build-dmg-assets.sh and are never checked in.

  The geometry is a contract with src-tauri/tauri.conf.json > bundle.macOS.dmg:
      windowSize                660 x 420   == this viewBox
      appPosition               170, 170    (icon CENTRE, 128pt icon => spans y 106..234)
      applicationFolderPosition 490, 170
  Finder draws its own item labels just under y=234. Everything this file paints below
  the icon row therefore starts at y>=300, which leaves ~65px of slack (deliberate:
  because the mapping from the AppleScript window bounds to the background origin can
  shift by the height of a title bar (~22px), and nothing here may collide when it does).

  German-first by decision: the drop target is *Programme*. Finder's own label under the
  folder is localised by macOS, which we cannot control from here (see docs/v2/RELEASE.md),
  so the word is painted into the art where it is guaranteed to appear. Quote style follows the app (src/js/i18n.js), not the other way round.
-->
  <defs>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b9aea"/>
      <stop offset="1" stop-color="#2f77dd"/>
    </linearGradient>
  </defs>

  <!-- Flat, on purpose, and the reason is a measurement rather than a taste.
       This background ships inside a DMG that has to fit in a mailbox, and a
       full-bleed gradient is the single most expensive thing you can put in a
       PNG: it dithers, so it does not compress. Measured on the 660x420 + 2x
       hidpi TIFF that actually ships:
           vertical gradient + warm radial glow   845 KB
           vertical gradient only                 571 KB
           flat                                   180 KB
       665 KB (4.6% of the tight 14.3 MB provider budget) for two gradients
       that are almost invisible at these values. Depth comes from the drop-well
       and the icons instead. If you reintroduce a gradient here, re-measure. -->
  <rect width="660" height="420" fill="#f2f5fa"/>

  <!-- wordmark -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="40" y="49" font-size="21" font-weight="600" fill="#16233d" letter-spacing="-0.3">LangzeitPlaner</text>
    <text x="40" y="70" font-size="11.5" fill="#7a8496">Zwölf Monate auf einen Blick.</text>
  </g>

  <!-- drop target: a dashed well exactly under applicationFolderPosition -->
  <!-- The well encloses the icon AND the label Finder draws under it (baseline ~250),
       and is deliberately generous: the Finder icon size inside a Tauri DMG is not
       configurable, so a smaller icon must still sit comfortably inside this frame. -->
  <rect x="404" y="86" width="172" height="184" rx="34"
        fill="#ffffff" fill-opacity="0.62" stroke="#a8c0e6" stroke-width="2" stroke-dasharray="9 7"/>

  <!-- the drag: a broad, soft arrow that survives a +-22px vertical shift -->
  <g fill="url(#arrow)" opacity="0.85">
    <rect x="264" y="162" width="104" height="16" rx="8"/>
    <path d="M364 146 L402 170 L364 194 Z"/>
  </g>

  <!-- instruction -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="330" y="312" font-size="16.5" font-weight="600" fill="#16233d">LangzeitPlaner in den Ordner „Programme“ ziehen</text>
    <text x="330" y="334" font-size="11.5" fill="#7d8798">Drag LangzeitPlaner into the Applications folder</text>

    <!-- the sentence that makes the unsigned first launch survivable (D1) -->
    <text x="330" y="366" font-size="10" fill="#7f8a9c">Beim ersten Öffnen zeigt macOS eine Sicherheitswarnung. Das ist normal — die E-Mail erklärt, was zu tun ist.</text>
    <text x="330" y="381" font-size="10" fill="#9aa3b2">macOS shows a security warning the first time. That is expected — the e-mail explains what to do.</text>
  </g>

</svg>
