<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2f77dd"/>
      <stop offset="0.42" stop-color="#1c5cc4"/>
      <stop offset="1" stop-color="#123f92"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9bf2"/>
      <stop offset="1" stop-color="#2166d2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e9ee"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#d3d7de"/>
      <stop offset="1" stop-color="#8f97a4"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d9f5"/>
      <stop offset="0.42" stop-color="#ffeab4"/>
      <stop offset="1" stop-color="#ffc94e"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="1" r="0.85">
      <stop offset="0" stop-color="#fffbe2"/>
      <stop offset="0.35" stop-color="#ffe589" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffc94e" stop-opacity="0"/>
    </radialGradient>
    <filter id="bodyshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#08234f" flood-opacity="0.34"/>
    </filter>
    <filter id="stairshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-10" dy="14" stdDeviation="12" flood-color="#08234f" flood-opacity="0.26"/>
    </filter>
    <clipPath id="archclip">
      <path d="M636 604 V468 a104 104 0 0 1 208 0 V604 Z"/>
    </clipPath>
  </defs>

  <rect x="52" y="52" width="920" height="920" rx="206" fill="url(#plate)"/>

  <!-- calendar -->
  <g filter="url(#bodyshadow)">
    <path d="M168 266 a56 56 0 0 1 56 -56 h576 a56 56 0 0 1 56 56 v576 a56 56 0 0 1 -56 56 h-576 a56 56 0 0 1 -56 -56 Z" fill="url(#paper)"/>
    <path d="M168 266 a56 56 0 0 1 56 -56 h576 a56 56 0 0 1 56 56 v122 h-688 Z" fill="url(#header)"/>
  </g>

  <!-- binder rings -->
  <rect x="332" y="130" width="60" height="172" rx="30" fill="none" stroke="url(#ring)" stroke-width="27"/>
  <rect x="632" y="130" width="60" height="172" rx="30" fill="none" stroke="url(#ring)" stroke-width="27"/>

  <!-- day cells -->
  <g fill="#d8dade">
    <rect x="232" y="432" width="88" height="78" rx="21"/>
    <rect x="352" y="432" width="88" height="78" rx="21"/>
    <rect x="232" y="546" width="88" height="78" rx="21"/>
    <rect x="352" y="546" width="88" height="78" rx="21"/>
    <rect x="472" y="546" width="88" height="78" rx="21"/>
    <rect x="232" y="660" width="88" height="78" rx="21"/>
    <rect x="352" y="660" width="88" height="78" rx="21"/>
  </g>
  <rect x="472" y="432" width="88" height="78" rx="21" fill="#2e86ef"/>

  <!-- arched sunrise -->
  <path d="M636 604 V468 a104 104 0 0 1 208 0 V604 Z" fill="url(#sky)"/>
  <g clip-path="url(#archclip)">
    <circle cx="740" cy="502" r="164" fill="url(#sunglow)"/>
    <circle cx="740" cy="506" r="62" fill="#fff6cc"/>
    <g fill="#ffffff" opacity="0.9">
      <path d="M662 434 h42 a16 16 0 0 0 0 -32 h-42 a16 16 0 0 0 0 32 Z"/>
      <path d="M786 462 h36 a14 14 0 0 0 0 -28 h-36 a14 14 0 0 0 0 28 Z"/>
    </g>
  </g>
  <path d="M636 606 V468 a104 104 0 0 1 208 0 V606" fill="none" stroke="#f6f7f9" stroke-width="11" stroke-linecap="round"/>

  <!-- staircase: five treads climbing into the sunrise -->
  <!-- step i: x = 230 + 80i, riser top y = 910 - 88i, riser 48, tread recedes (+80, -40) -->
  <g filter="url(#stairshadow)">
    <!-- 0 · blue -->
    <polygon points="230,918 530,918 530,966 230,966" fill="#2568b3"/>
    <polygon points="530,918 610,878 610,926 530,966" fill="#1d5596"/>
    <polygon points="230,918 530,918 610,878 310,878" fill="#3287e0"/>
    <!-- 1 · teal -->
    <polygon points="310,834 610,834 610,882 310,882" fill="#1c8896"/>
    <polygon points="610,834 690,794 690,842 610,882" fill="#16717d"/>
    <polygon points="310,834 610,834 690,794 390,794" fill="#25adbc"/>
    <!-- 2 · green -->
    <polygon points="390,750 690,750 690,798 390,798" fill="#3f9a56"/>
    <polygon points="690,750 770,710 770,758 690,798" fill="#347f47"/>
    <polygon points="390,750 690,750 770,710 470,710" fill="#54bf6c"/>
    <!-- 3 · yellow-green -->
    <polygon points="470,666 770,666 770,714 470,714" fill="#6fa726"/>
    <polygon points="770,666 850,626 850,674 770,714" fill="#5c8b1e"/>
    <polygon points="470,666 770,666 850,626 550,626" fill="#8ecd33"/>
    <!-- 4 · yellow -->
    <polygon points="550,582 850,582 850,630 550,630" fill="#a0b112"/>
    <polygon points="850,582 930,542 930,590 850,630" fill="#86940e"/>
    <polygon points="550,582 850,582 930,542 630,542" fill="#c8dc1b"/>
  </g>
</svg>
